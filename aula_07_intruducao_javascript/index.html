<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aula 07 - Introdução ao Javascript</title>
</head>
<body>
    <h1>Introdução ao Javascript</h1>
</body>

<!-- JAVASCRIPT -->
<script>
    // Dispara uma janela de ALERTA
    window.alert('Bem-vindo ao meu primeiro site com Javascript!')
    // Dispara uma janela de confirmação
    window.confirm('Vamos começar a aprender sobre variáveis?')

    // ARMAZENANDO O NOME DO USUÁRIO EM UMA VARIÁVEL
    const nome = window.prompt('Qual é o seu nome?')
    // prompt -> abre uma janela de inserção de dados

    let idade = window.prompt('Qual é a sua idade?')

    /* Comentário de linhas */
    // Comentário único

    // ESCREVENDO NO SITE
    document.write('Olá ' + nome + '! Vamos aprender sobre variáveis!')
    document.write('<br>')
    document.write('Sua idade é ' + idade + '!')

</script>

</html>
