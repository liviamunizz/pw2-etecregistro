<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício</title>
</head>
<body>
    <h1>Operações Matemáticas</h1>
</body>
<script>
    const n1 = Number(window.prompt('Digite um número:'))
    const n2 = Number(window.prompt('Digite outro número:'))

    const resultadosoma = Number(n1) + Number(n2);
    const resultadosub = Number(n1) - Number(n2);
    const resultadodivi = Number(n1) / Number(n2);
    const resultadomulti = Number(n1) * Number(n2);
    document.write(`O resultado de ${n1} + ${n2} é igual a: ${resultadosoma} <br>`)
    document.write(`O resultado de ${n1} - ${n2} é igual a: ${resultadosub} <br>`)
    document.write(`O resultado de ${n1} / ${n2} é igual a: ${resultadodivi} <br>`)
    document.write(`O resultado de ${n1} * ${n2} é igual a: ${resultadomulti}`)

</script>

</html>
