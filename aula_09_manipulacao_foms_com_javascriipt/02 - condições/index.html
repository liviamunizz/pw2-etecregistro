<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Condições no Javascript</title>
    <!-- Importação Javascript -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="calculadora">
    <h1>Calculadora da Lívia</h1>

    <!-- Entradas de número -->
    <div class="campo-grupo">
        <label for="num1">Primeiro Número:</label>
        <input type="number" id="num1" placeholder="Digite um número">
    </div>

    <div class="campo-grupo">
        <label for="num2">Segundo Número:</label>
        <input type="number" id="num2" placeholder="Digite outro número">
    </div>

    <!-- Botões de operações básicas -->
    <div class="botoes-operacoes">
        <button type="button" onclick="somar()">+</button>
        <button type="button" onclick="subtrair()">-</button>
        <button type="button" onclick="multiplicar()">*</button>
        <button type="button" onclick="dividir()">/</button>
    </div>

    <!-- Botão para limpar campos -->
    <button type="button" class="btn-limpar" onclick="limpar()">Limpar</button>

    <!-- Exibição do resultado -->
    <div id="resultado">Resultado: -</div>
</div>

<!-- Importação do JavaScript -->
<script src="script.js"></script>
</body>
</html>
